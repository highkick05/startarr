services:
  startarr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: startarr
    ports:
      - "3055:3000"
    volumes:
      # Persist the SQLite DB and custom images across rebuilds
      - app-data:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change_this_to_a_long_random_secret_key}
    restart: unless-stopped

volumes:
  app-data:

