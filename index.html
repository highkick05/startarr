<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Startarr</title>
    <meta name="description" content="A drag-and-drop customizable dashboard homepage for app shortcuts and scalable widgets including remote SSH terminals." />
    <meta property="og:title" content="Startarr" />
    <meta property="og:description" content="A drag-and-drop customizable dashboard homepage for app shortcuts and scalable widgets including remote SSH terminals." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body {
        background-color: #0b0f17;
        margin: 0;
        padding: 0;
      }
    </style>
    <script>
      (function() {
        try {
          var bg = localStorage.getItem('activeBackground');
          if (bg && bg !== 'none' && !bg.match(/\.(mp4|webm|ogg)$/i)) {
            var s = document.createElement('style');
            s.id = 'early-bg-style';
            s.textContent = 'body { background-image: url("' + bg + '"); background-size: cover; background-position: center; background-repeat: no-repeat; }';
            document.head.appendChild(s);
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-neutral-950 text-neutral-100 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
